[project]
name = "paa_graph_kb"
version = "0.1.0"
description = "Tool for building CRM graph for Perseus-AA"
authors = [
    {name = "Cliff Wulfman", email = "cwulfman@princeton.edu"},
]
dependencies = ["rdflib>=7.4.0", "pyshacl>=0.30.1", "python-dotenv>=1.2.1", "requests>=2.32.5", "pydantic>=2.12.3", "rich>=13.7.1", "typer>=0.20.0", "SPARQLWrapper>=2.0.0"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
package-dir = "src"

[tool.pdm.build]
package-dir = "src"
includes = [
  "src/paa_graph_kb/**/*.py",
  "src/paa_graph_kb/resources/templates/*.rq",
  "src/paa_graph_kb/resources/shapes/*.ttl",
  "src/paa_graph_kb/vocabularies/**/*.ttl",
  "src/paa_graph_kb/graphdb/**",
]

[project.scripts]
paa-run-constructs = "paa_graph_kb.cli.run_constructs:main"
paa-staging-loader = "paa_graph_kb.cli.staging_loader:main"
paa-validate-shacl = "paa_graph_kb.cli.validate_shacl:main"
paa-browse-kb = "paa_graph_kb.cli.browse_kb:app"

[tool.pdm.scripts]
test = "pytest"
test_verbose = "pytest -v"
cov = "pytest --cov=my_python_project --cov-report=html"
cov_report = {shell = "python -m http.server -d htmlcov"}
lint = "ruff check"
typecheck = "mypy src"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--cov=my_python_project --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.11.3",
    "mypy>=1.15.0",
]
